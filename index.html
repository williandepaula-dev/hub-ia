<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#04060b" />
  <title>OMNITRON // Willian AI Hub</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg: #04060b;
      --panel: rgba(10, 16, 28, 0.78);
      --border: rgba(56, 189, 248, 0.28);
      --cyan: #38bdf8;
      --violet: #8b5cf6;
      --amber: #f59e0b;
      --crimson: #ef4444;
      --emerald: #10b981;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --core-primary: #38bdf8;
      --core-secondary: #8b5cf6;
      --core-glow: rgba(56, 189, 248, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 50% 42%, rgba(56, 189, 248, 0.09) 0%, transparent 60%),
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
    }

    /* HUD Corners */
    .hud-corner {
      position: fixed;
      width: 18px;
      height: 18px;
      border-color: var(--cyan);
      opacity: 0.45;
      pointer-events: none;
      z-index: 5;
    }
    .tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
    .tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
    .bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
    .br { bottom: 8px; right: 8px; border-bottom: 2px solid; border-right: 2px solid; }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 10px 12px;
      background: rgba(4, 6, 11, 0.85);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select, .hud-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      outline: none;
      cursor: pointer;
    }

    select {
      max-width: 138px;
      color: var(--cyan);
    }

    .hud-btn.active {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
      color: #fff;
    }

    /* Mode Strip */
    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px 4px;
      z-index: 15;
    }

    .mode-pill {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-pill.active {
      color: #fff;
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.16);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
    }

    /* Center Omnitron Eye Stage */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 16px;
      overflow: hidden;
    }

    .omnitron-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      margin-bottom: 14px;
    }

    /* State Color Themes */
    body[data-state="idle"] {
      --core-primary: #38bdf8;
      --core-secondary: #6366f1;
      --core-glow: rgba(56, 189, 248, 0.42);
    }
    body[data-state="listening"] {
      --core-primary: #10b981;
      --core-secondary: #34d399;
      --core-glow: rgba(16, 185, 129, 0.65);
    }
    body[data-state="thinking"] {
      --core-primary: #f59e0b;
      --core-secondary: #8b5cf6;
      --core-glow: rgba(245, 158, 11, 0.6);
    }
    body[data-state="speaking"] {
      --core-primary: #ef4444;
      --core-secondary: #f97316;
      --core-glow: rgba(239, 68, 68, 0.78);
    }

    .energy-aura {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--core-glow) 0%, transparent 70%);
      filter: blur(12px);
      animation: breathe 3.4s ease-in-out infinite;
      transition: background 0.35s ease;
    }

    .ring-outer {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1.5px dashed var(--core-primary);
      opacity: 0.55;
      animation: spinCW 22s linear infinite;
    }

    .ring-mid {
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--core-primary);
      border-bottom-color: var(--core-secondary);
      animation: spinCCW 9s linear infinite;
    }

    .ring-inner {
      position: absolute;
      inset: 46px;
      border-radius: 50%;
      border: 1px solid var(--core-primary);
      box-shadow: 0 0 24px var(--core-glow), inset 0 0 24px var(--core-glow);
      animation: spinCW 6s linear infinite;
    }

    /* Omnitron Eye Sclera & Iris */
    .eye-socket {
      position: relative;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #0f172a 30%, #02040a 100%);
      border: 2px solid var(--core-primary);
      box-shadow:
        0 0 35px var(--core-glow),
        inset 0 0 30px rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.3s ease;
    }

    .eye-iris {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from 0deg,
          transparent 0deg 8deg,
          rgba(255, 255, 255, 0.12) 9deg 10deg
        ),
        radial-gradient(circle, #ffffff 0%, var(--core-primary) 42%, var(--core-secondary) 80%, #000 100%);
      box-shadow: 0 0 28px var(--core-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.12s ease;
    }

    .eye-pupil {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #020409;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 14px #fff;
      position: relative;
    }

    .eye-pupil::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 5px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
    }

    /* Speaking & Thinking Animations */
    body[data-state="thinking"] .ring-mid { animation-duration: 1.4s; }
    body[data-state="thinking"] .ring-inner { animation-duration: 1s; }
    body[data-state="speaking"] .eye-iris { animation: voicePulse 0.34s ease-in-out infinite alternate; }
    body[data-state="speaking"] .energy-aura { animation: auraSurge 0.42s ease-in-out infinite alternate; }
    body[data-state="listening"] .eye-socket { transform: scale(1.07); }

    @keyframes spinCW { to { transform: rotate(360deg); } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }
    @keyframes breathe {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes voicePulse {
      from { transform: scale(0.90); }
      to { transform: scale(1.16); }
    }
    @keyframes auraSurge {
      from { transform: scale(0.96); opacity: 0.78; }
      to { transform: scale(1.18); opacity: 1; }
    }

    /* Status & Live Voice Teleprompter */
    .status-line {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--core-primary);
      text-shadow: 0 0 10px var(--core-glow);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stop-voice-btn {
      display: none;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--crimson);
      color: #fca5a5;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    body[data-state="speaking"] .stop-voice-btn {
      display: inline-block;
    }

    .teleprompter {
      width: 100%;
      max-width: 520px;
      min-height: 76px;
      max-height: 132px;
      overflow-y: auto;
      background: rgba(10, 16, 28, 0.68);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13.5px;
      line-height: 1.5;
      color: #f1f5f9;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    /* Quick Chips */
    .quick-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      width: 100%;
      max-width: 520px;
      padding: 10px 0 2px;
      scrollbar-width: none;
    }
    .quick-chips::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      cursor: pointer;
    }

    /* Bottom Controls */
    footer {
      padding: 8px 12px 12px;
      background: rgba(4, 6, 11, 0.92);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    .mic-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--cyan);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25), rgba(10, 16, 28, 0.95));
      color: #fff;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
    }

    body[data-state="listening"] .mic-btn {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.3);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.7);
    }

    .prompt-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 11px 15px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Drawer / Modals */
    .overlay-panel {
      position: fixed;
      inset: 54px 10px 68px 10px;
      background: rgba(6, 10, 19, 0.96);
      border: 1px solid var(--cyan);
      border-radius: 16px;
      z-index: 40;
      display: none;
      flex-direction: column;
      padding: 14px;
      backdrop-filter: blur(14px);
    }
    .overlay-panel.open { display: flex; }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .msg {
      padding: 10px 12px;
      border-radius: 12px;
      max-width: 92%;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .msg.ai {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .field-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }
    .field-group input, .field-group select {
      max-width: 100%;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      color: #fff;
    }
  </style>
</head>
<body data-state="idle">
  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>

  <header>
    <div class="hud-group">
      <button class="hud-btn" id="btn-settings" title="Configurar API">⚙️</button>
      <select id="model-select">
        <option value="anthropic/claude-opus-4">Claude Opus</option>
        <option value="google/gemini-2.5-pro-preview">Gemini 2.5 Pro</option>
        <option value="openai/gpt-4o">GPT-4o / Omni</option>
        <option value="deepseek/deepseek-r1">DeepSeek R1</option>
        <option value="x-ai/grok-3">Grok 3</option>
      </select>
    </div>

    <div class="hud-group">
      <button class="hud-btn active" id="btn-voice-toggle">🔊 Voz ON</button>
      <button class="hud-btn" id="btn-log-toggle">📜 Texto</button>
    </div>
  </header>

  <div class="mode-bar">
    <button class="mode-pill active" data-mode="chat">⚡ Núcleo IA</button>
    <button class="mode-pill" data-mode="insta">📸 Insta Tattoo</button>
    <button class="mode-pill" data-mode="whats">💬 WhatsApp</button>
  </div>

  <main>
    <div class="omnitron-wrapper" id="omnitron-eye" title="Toque para falar ou parar voz">
      <div class="energy-aura"></div>
      <div class="ring-outer"></div>
      <div class="ring-mid"></div>
      <div class="ring-inner"></div>
      <div class="eye-socket">
        <div class="eye-iris">
          <div class="eye-pupil"></div>
        </div>
      </div>
    </div>

    <div class="status-line">
      <span id="status-text">OMNITRON ONLINE • TOQUE NO OLHO PARA FALAR</span>
      <button class="stop-voice-btn" id="btn-stop-voice">⏹ PARAR VOZ</button>
    </div>

    <div class="teleprompter" id="teleprompter">
      Núcleo Omnitron ativo, Willian. Toque no olho central e dê o seu comando.
    </div>

    <div class="quick-chips">
      <button class="chip" data-prompt="Crie uma legenda curta e magnética para Reels de tatuagem Black & Grey em Guarulhos com chamada para o WhatsApp.">🎬 Legenda Reels</button>
      <button class="chip" data-prompt="Crie uma resposta rápida e persuasiva de WhatsApp para cliente perguntando quanto custa uma tatuagem realista.">💬 Fechar Orçamento</button>
      <button class="chip" data-prompt="Me explique de forma direta e resumida como otimizar o desempenho de um jogo 3D no Unity para celular.">🎮 Otimizar Unity</button>
      <button class="chip" data-prompt="Gere um script curto para automatizar atendimento de estúdio de tatuagem.">💻 Gerar Código</button>
    </div>
  </main>

  <footer>
    <button class="mic-btn" id="btn-mic" title="Falar por voz">🎙️</button>
    <input type="text" class="prompt-input" id="prompt-input" placeholder="Fale ou digite seu comando..." />
    <button class="send-btn" id="btn-send" title="Enviar">➤</button>
  </footer>

  <!-- Full Text Transcript Overlay -->
  <div class="overlay-panel" id="log-panel">
    <div class="overlay-header">
      <span>REGISTRO DE TRANSMISSÃO (TEXTO & CÓDIGO)</span>
      <button class="hud-btn" id="btn-close-log">✕ Fechar</button>
    </div>
    <div class="chat-log" id="chat-log"></div>
  </div>

  <!-- Settings Modal -->
  <div class="overlay-panel" id="settings-panel">
    <div class="overlay-header">
      <span>CONFIGURAÇÃO DO NÚCLEO OMNITRON</span>
      <button class="hud-btn" id="btn-close-settings">✕ Fechar</button>
    </div>
    <div class="field-group">
      <label>Chave de API (OpenRouter `sk-or-...`, Gemini `AIza...` ou Groq `gsk_...`)</label>
      <input type="password" id="api-key-input" placeholder="Cole sua API Key aqui..." />
    </div>
    <div class="field-group">
      <label>Perfil de Voz</label>
      <select id="voice-preset-select">
        <option value="transformer">🤖 Transformer / Deus (Grave & Robótico)</option>
        <option value="titan">⚡ Titã Profundo (Ultra Grave)</option>
        <option value="natural">🎙️ Comando Natural</option>
      </select>
    </div>
    <div class="field-group">
      <label>Gravidade / Tom da Voz (0.30 = Mega Grave | 0.48 = Transformer | 1.0 = Normal)</label>
      <input type="number" id="voice-pitch-input" step="0.02" min="0.25" max="1.3" value="0.48" />
    </div>
    <div class="field-group">
      <label>Velocidade da Fala (0.85 = Imponente | 0.90 = Padrão | 1.1 = Rápido)</label>
      <input type="number" id="voice-rate-input" step="0.05" min="0.65" max="1.5" value="0.90" />
    </div>
    <div class="field-group" style="flex-direction: row; align-items: center; gap: 8px;">
      <input type="checkbox" id="cyber-hum-input" checked style="width: 18px; height: 18px;" />
      <label for="cyber-hum-input" style="color: #e2e8f0;">Ativar Ressonância Sub-Bass & Som Mecânico ao falar</label>
    </div>
    <button class="send-btn" id="btn-save-settings" style="width:100%; border-radius:12px; font-size:14px;">Salvar Configurações</button>
  </div>

  <script>
    const state = {
      mode: 'chat',
      voiceEnabled: true,
      apiKey: localStorage.getItem('openrouter_api_key')
           || localStorage.getItem('api_key')
           || localStorage.getItem('gemini_api_key')
           || localStorage.getItem('groq_api_key')
           || '',
      voiceRate: parseFloat(localStorage.getItem('omni_rate_v2') || '0.90'),
      voicePitch: parseFloat(localStorage.getItem('omni_pitch_v2') || '0.48'),
      cyberHum: localStorage.getItem('omni_hum_v2') !== 'false',
      history: []
    };

    const body = document.body;
    const statusText = document.getElementById('status-text');
    const teleprompter = document.getElementById('teleprompter');
    const promptInput = document.getElementById('prompt-input');
    const chatLog = document.getElementById('chat-log');
    const apiKeyInput = document.getElementById('api-key-input');
    const voiceRateInput = document.getElementById('voice-rate-input');
    const voicePitchInput = document.getElementById('voice-pitch-input');
    const voicePresetSelect = document.getElementById('voice-preset-select');
    const cyberHumInput = document.getElementById('cyber-hum-input');

    apiKeyInput.value = state.apiKey;
    voiceRateInput.value = state.voiceRate;
    voicePitchInput.value = state.voicePitch;
    cyberHumInput.checked = state.cyberHum;

    voicePresetSelect.addEventListener('change', () => {
      if (voicePresetSelect.value === 'transformer') {
        voicePitchInput.value = '0.48';
        voiceRateInput.value = '0.90';
      } else if (voicePresetSelect.value === 'titan') {
        voicePitchInput.value = '0.32';
        voiceRateInput.value = '0.84';
      } else {
        voicePitchInput.value = '0.95';
        voiceRateInput.value = '1.05';
      }
    });

    function setVisualState(newState, label) {
      body.setAttribute('data-state', newState);
      if (label) statusText.textContent = label;
    }

    // --- CYBERNETIC SUB-BASS & TRANSFORMER SERVO AUDIO (WEB AUDIO API) ---
    let audioCtx = null;
    let droneNodes = null;

    function getAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playServoIgnition() {
      if (!state.cyberHum) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(52, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(48, now + 0.36);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(320, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.11, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function startCyberDrone() {
      if (!state.cyberHum || droneNodes) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const subOsc = ctx.createOscillator();
        const modOsc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const masterGain = ctx.createGain();

        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(54, now);

        modOsc.type = 'sawtooth';
        modOsc.frequency.setValueAtTime(108, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(165, now);

        masterGain.gain.setValueAtTime(0.001, now);
        masterGain.gain.linearRampToValueAtTime(0.055, now + 0.25);

        subOsc.connect(filter);
        modOsc.connect(filter);
        filter.connect(masterGain);
        masterGain.connect(ctx.destination);

        subOsc.start(now);
        modOsc.start(now);
        droneNodes = { subOsc, modOsc, masterGain };
      } catch (e) {}
    }

    function stopCyberDrone() {
      if (!droneNodes) return;
      try {
        const ctx = getAudioContext();
        const now = ctx ? ctx.currentTime : 0;
        if (ctx) {
          droneNodes.masterGain.gain.setTargetAtTime(0.0001, now, 0.08);
        }
        const nodes = droneNodes;
        droneNodes = null;
        setTimeout(() => {
          try { nodes.subOsc.stop(); nodes.modOsc.stop(); } catch (e) {}
        }, 220);
      } catch (e) {
        droneNodes = null;
      }
    }

    // --- VOICE SYNTHESIS (TTS) ENGINE ---
    let speechQueue = [];
    let isSpeaking = false;

    function cleanTextForSpeech(raw) {
      let text = raw.replace(/```[\s\S]*?```/g, '. Gerei o bloco de código completo na tela. Toque em Texto no topo para copiar. ');
      text = text
        .replace(/[#>*_`~|-]/g, ' ')
        .replace(/\[(.*?)\]\(.*?\)/g, '$1')
        .replace(/https?:\/\/\S+/g, 'link na tela')
        .replace(/\s+/g, ' ')
        .trim();
      return text;
    }

    function splitIntoChunks(text) {
      const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
      const chunks = [];
      let current = '';
      for (const s of sentences) {
        if ((current + s).length > 165 && current.length > 0) {
          chunks.push(current.trim());
          current = s;
        } else {
          current += ' ' + s;
        }
      }
      if (current.trim()) chunks.push(current.trim());
      return chunks;
    }

    function getPtBrVoice() {
      const voices = window.speechSynthesis.getVoices();
      const ptVoices = voices.filter(v => v.lang.toLowerCase().includes('pt'));
      return (
        ptVoices.find(v => /male|masculino|daniel|felipe|ricardo|antonio/i.test(v.name)) ||
        ptVoices.find(v => v.lang.toLowerCase().includes('pt-br') && v.name.toLowerCase().includes('google')) ||
        ptVoices.find(v => v.lang.toLowerCase().includes('pt-br')) ||
        ptVoices[0] ||
        null
      );
    }

    function stopSpeech() {
      speechQueue = [];
      isSpeaking = false;
      stopCyberDrone();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      setVisualState('idle', 'OMNITRON ONLINE • AGUARDANDO COMANDO');
    }

    function speakNextChunk() {
      if (!state.voiceEnabled || speechQueue.length === 0) {
        isSpeaking = false;
        stopCyberDrone();
        setVisualState('idle', 'OMNITRON ONLINE • AGUARDANDO COMANDO');
        return;
      }
      isSpeaking = true;
      startCyberDrone();
      setVisualState('speaking', 'NÚCLEO OMNITRON TRANSMITINDO...');
      const chunk = speechQueue.shift();
      teleprompter.textContent = chunk;

      const utter = new SpeechSynthesisUtterance(chunk);
      const voice = getPtBrVoice();
      if (voice) utter.voice = voice;
      utter.lang = 'pt-BR';
      utter.rate = state.voiceRate;
      utter.pitch = state.voicePitch;

      utter.onend = () => speakNextChunk();
      utter.onerror = () => speakNextChunk();

      window.speechSynthesis.speak(utter);
    }

    function speakResponse(fullText) {
      stopSpeech();
      if (!state.voiceEnabled || !('speechSynthesis' in window)) {
        teleprompter.textContent = cleanTextForSpeech(fullText);
        setVisualState('idle', 'OMNITRON ONLINE • VOZ SILENCIADA');
        return;
      }
      playServoIgnition();
      const clean = cleanTextForSpeech(fullText);
      speechQueue = splitIntoChunks(clean);
      speakNextChunk();
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => getPtBrVoice();
    }

    // --- SPEECH RECOGNITION (STT) ---
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = 'pt-BR';
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        getAudioContext();
        stopSpeech();
        setVisualState('listening', 'OUVINDO SUA VOZ... FALE AGORA');
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        promptInput.value = transcript;
        teleprompter.textContent = '“' + transcript + '”';
        if (event.results[event.results.length - 1].isFinal) {
          sendMessage(transcript);
        }
      };

      recognition.onerror = () => {
        setVisualState('idle', 'MICROFONE INDISPONÍVEL • DIGITE OU TENTE DE NOVO');
      };

      recognition.onend = () => {
        if (body.getAttribute('data-state') === 'listening') {
          setVisualState('idle', 'OMNITRON ONLINE • AGUARDANDO COMANDO');
        }
      };
    }

    function toggleListening() {
      getAudioContext();
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      if (!recognition) {
        alert('Reconhecimento de voz não suportado neste navegador. Use o Google Chrome.');
        return;
      }
      try {
        recognition.start();
      } catch (e) {
        recognition.stop();
      }
    }

    // --- AI API CALL ---
    function getSystemPrompt() {
      const base = 'Você é OMNITRON, uma inteligência artificial suprema, poderosa, precisa e imponente do estúdio de Willian de Paula (@williandepaulatattoo) em Guarulhos, SP. Responda em português do Brasil com autoridade, clareza e frases bem estruturadas para serem faladas em voz alta (sem símbolos desnecessários, a menos que seja código). ';
      if (state.mode === 'insta') {
        return base + 'Foco atual: criar legendas de alto impacto, ganchos virais para Reels e estratégias de Instagram para atrair clientes de tatuagem Black & Grey e Realismo em Guarulhos.';
      }
      if (state.mode === 'whats') {
        return base + 'Foco atual: criar respostas rápidas, educadas e persuasivas para fechar orçamentos e agendamentos de tatuagem pelo WhatsApp.';
      }
      return base + 'Foco atual: assistente técnico e estratégico multifuncional (programação, games Unity/Blender, negócios e automação).';
    }

    function appendLog(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function sendMessage(customText) {
      getAudioContext();
      const text = (customText || promptInput.value).trim();
      if (!text) return;

      promptInput.value = '';
      appendLog('user', text);

      if (!state.apiKey) {
        const warn = 'Nenhuma chave de API configurada. Toque na engrenagem no canto superior esquerdo e cole sua chave OpenRouter, Gemini ou Groq.';
        teleprompter.textContent = warn;
        speakResponse(warn);
        document.getElementById('settings-panel').classList.add('open');
        return;
      }

      setVisualState('thinking', 'PROCESSANDO NO NÚCLEO OMNITRON...');
      teleprompter.textContent = 'Analisando comando...';

      state.history.push({ role: 'user', content: text });
      if (state.history.length > 8) state.history = state.history.slice(-8);

      try {
        let reply = '';
        const key = state.apiKey.trim();

        if (key.startsWith('AIza')) {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: getSystemPrompt() + '\n\nPergunta: ' + text }] }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sem resposta do núcleo.';
        } else if (key.startsWith('gsk_')) {
          const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${key}`
            },
            body: JSON.stringify({
              model: 'llama-3.3-70b-versatile',
              messages: [{ role: 'system', content: getSystemPrompt() }, ...state.history]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.choices?.[0]?.message?.content || 'Sem resposta do núcleo.';
        } else {
          const model = document.getElementById('model-select').value;
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${key}`,
              'HTTP-Referer': window.location.href,
              'X-Title': 'Omnitron AI Hub'
            },
            body: JSON.stringify({
              model,
              messages: [{ role: 'system', content: getSystemPrompt() }, ...state.history]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.choices?.[0]?.message?.content || 'Sem resposta do núcleo.';
        }

        state.history.push({ role: 'assistant', content: reply });
        appendLog('ai', reply);
        speakResponse(reply);
      } catch (err) {
        const errMsg = 'Falha na conexão com a IA: ' + err.message;
        appendLog('ai', errMsg);
        teleprompter.textContent = errMsg;
        speakResponse('Falha de comunicação com o servidor. Verifique sua chave de acesso.');
      }
    }

    // --- UI EVENT LISTENERS ---
    document.getElementById('omnitron-eye').addEventListener('click', toggleListening);
    document.getElementById('btn-mic').addEventListener('click', toggleListening);
    document.getElementById('btn-send').addEventListener('click', () => sendMessage());
    document.getElementById('btn-stop-voice').addEventListener('click', stopSpeech);

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('btn-voice-toggle').addEventListener('click', (e) => {
      state.voiceEnabled = !state.voiceEnabled;
      e.target.textContent = state.voiceEnabled ? '🔊 Voz ON' : '🔇 Mudo';
      e.target.classList.toggle('active', state.voiceEnabled);
      if (!state.voiceEnabled) stopSpeech();
    });

    document.getElementById('btn-log-toggle').addEventListener('click', () => {
      document.getElementById('log-panel').classList.toggle('open');
    });
    document.getElementById('btn-close-log').addEventListener('click', () => {
      document.getElementById('log-panel').classList.remove('open');
    });

    document.getElementById('btn-settings').addEventListener('click', () => {
      document.getElementById('settings-panel').classList.add('open');
    });
    document.getElementById('btn-close-settings').addEventListener('click', () => {
      document.getElementById('settings-panel').classList.remove('open');
    });

    document.getElementById('btn-save-settings').addEventListener('click', () => {
      state.apiKey = apiKeyInput.value.trim();
      state.voiceRate = parseFloat(voiceRateInput.value) || 0.90;
      state.voicePitch = parseFloat(voicePitchInput.value) || 0.48;
      state.cyberHum = cyberHumInput.checked;
      localStorage.setItem('openrouter_api_key', state.apiKey);
      localStorage.setItem('omni_rate_v2', state.voiceRate);
      localStorage.setItem('omni_pitch_v2', state.voicePitch);
      localStorage.setItem('omni_hum_v2', state.cyberHum);
      document.getElementById('settings-panel').classList.remove('open');
      speakResponse('Sistemas vocais do núcleo Omnitron calibrados. Aguardando suas ordens, Willian.');
    });

    document.querySelectorAll('.mode-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.mode = btn.dataset.mode;
      });
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => sendMessage(chip.dataset.prompt));
    });
  </script>
</body>
</html>
