<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Decalque Pro" />
  <title>GERADOR DE DECALQUE — Studio Pro Stencil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #0b0b0c;
      --bg-card: #151518;
      --border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #9ca3af;
      --accent-orange: #ea580c;
      --accent-red: #dc2626;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 14px 14px 48px;
      line-height: 1.45;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Install Banner */
    .install-card {
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.14), rgba(220, 38, 38, 0.08));
      border: 1px solid rgba(234, 88, 12, 0.35);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .install-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .install-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #ea580c, #dc2626);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      font-size: 18px;
    }

    .install-text strong {
      display: block;
      font-size: 13px;
      color: #fff;
    }

    .install-text span {
      display: block;
      font-size: 11px;
      color: #9ca3af;
    }

    .btn-install {
      background: linear-gradient(135deg, #ea580c, #dc2626);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #a1a1aa;
      margin-bottom: 12px;
    }

    .dot-green {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .main-title {
      font-family: 'Anton', sans-serif;
      font-size: clamp(38px, 9vw, 54px);
      letter-spacing: 0.03em;
      line-height: 1.02;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #d4d4d8;
      font-weight: 500;
    }

    .subtitle span {
      color: var(--accent-green);
      font-weight: 700;
    }

    /* Section Card */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #a1a1aa;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Upload Zone */
    .upload-zone {
      position: relative;
      border: 2px dashed #3f3f46;
      border-radius: 16px;
      background: #111114;
      padding: 30px 18px;
      text-align: center;
      overflow: hidden;
    }

    .native-file-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
      font-size: 100px;
    }

    .upload-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(234, 88, 12, 0.14);
      border: 1px solid rgba(234, 88, 12, 0.35);
      color: #fb923c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 20px;
    }

    .upload-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .upload-hint {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .btn-gallery-visual {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #ea580c, #dc2626);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.35);
    }

    /* Preview Box */
    .preview-loaded {
      display: none;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #09090b;
      border: 1px solid #27272a;
      text-align: center;
    }

    .preview-loaded img {
      max-height: 290px;
      width: 100%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .change-photo-wrap {
      position: relative;
      display: inline-block;
      margin: 10px auto;
    }

    .btn-change-photo {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Mode Cards */
    .modes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      background: #111114;
      border: 1.5px solid #27272a;
      border-radius: 14
